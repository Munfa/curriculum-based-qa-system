<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Curriculum Based Bangla Study Assistant</title>
<link rel="stylesheet" href="css/styles.css" />
</head>

<body>

<div class="app-shell">

  <aside class="spine">

    <div class="brand">

      <div class="brand-mark" aria-hidden="true">

        <svg viewBox="0 0 40 40" width="34" height="34">

          <path
            d="M4 8 C4 6 6 5 8 5.5 L18 8 L18 32 L8 30 C6 29.6 4 28 4 26 Z"
            fill="#fffdf7"
            opacity="0.92"
          />

          <path
            d="M36 8 C36 6 34 5 32 5.5 L22 8 L22 32 L32 30 C34 29.6 36 28 36 26 Z"
            fill="#fffdf7"
            opacity="0.75"
          />

          <line
            x1="20"
            y1="7"
            x2="20"
            y2="32"
            stroke="#c99a3e"
            stroke-width="1.2"
          />

        </svg>

      </div>

      <h1 class="brand-title">

        Bangla Study Assistant

        <span class="bn">
          বাংলা পাঠ সহায়ক
        </span>

      </h1>

    </div>


    <div
      class="progress-dots"
      id="progress-dots"
      aria-hidden="true"
    >

      <div
        class="progress-dot"
        data-key="class"
      >
        <span></span>
        Class
      </div>


      <!-- <div
        class="progress-dot hidden"
        id="group-progress"
        data-key="group"
      >
        <span></span>
        Group
      </div> -->


      <div
        class="progress-dot"
        data-key="subject"
      >
        <span></span>
        Subject
      </div>


      <div
        class="progress-dot"
        data-key="chapter"
      >
        <span></span>
        Chapter
      </div>

    </div>


    <div class="spine-section">

      <span class="spine-label">
        Class
      </span>

      <select
        class="spine-select"
        id="class-select"
        disabled
      >

        <option value="">
          Loading…
        </option>

      </select>

    </div>


    <!-- <div
      class="spine-section hidden"
      id="group-section"
    >

      <span class="spine-label">
        Group
      </span>

      <select
        class="spine-select"
        id="group-select"
        disabled
      >

        <option value="">
          Select a group
        </option>

      </select>

    </div> -->


    <div class="spine-section">

      <span class="spine-label">
        Subject
      </span>

      <select
        class="spine-select"
        id="subject-select"
        disabled
      >

        <option value="">
          Select a class first
        </option>

      </select>

    </div>


    <div class="spine-section">

      <span class="spine-label">
        Chapter
      </span>

      <select
        class="spine-select"
        id="chapter-select"
        disabled
      >

        <option value="">
          Select a subject first
        </option>

      </select>

    </div>


    <div class="spine-section">

      <span class="spine-label">
        Mode
      </span>


      <div class="mode-tabs">


        <button
          class="mode-tab"
          data-mode="qa"
          aria-pressed="false"
        >

          <svg
            class="mode-icon"
            viewBox="0 0 20 20"
            width="16"
            height="16"
            fill="none"
            stroke="currentColor"
            stroke-width="1.6"
          >

            <circle
              cx="10"
              cy="10"
              r="8"
            />

            <path
              d="M7.6 7.5c.3-1.3 1.5-2 2.7-1.8 1.2.2 2 1.1 1.9 2.2-.1 1.2-1.5 1.6-1.9 2.6-.1.4-.2.8-.2 1.2"
              stroke-linecap="round"
            />

            <circle
              cx="10"
              cy="14"
              r="0.6"
              fill="currentColor"
              stroke="none"
            />

          </svg>


          <span class="mode-tab-text">

            Ask Question

            <span class="bn">
              প্রশ্ন করুন
            </span>

          </span>

        </button>


        <button
          class="mode-tab"
          data-mode="mcq"
          aria-pressed="false"
        >

          <svg
            class="mode-icon"
            viewBox="0 0 20 20"
            width="16"
            height="16"
            fill="none"
            stroke="currentColor"
            stroke-width="1.6"
          >

            <rect
              x="2.5"
              y="3"
              width="15"
              height="14"
              rx="1.5"
            />

            <path
              d="M6 7.5h8M6 10.5h8M6 13.5h5"
              stroke-linecap="round"
            />

          </svg>


          <span class="mode-tab-text">

            MCQ Practice

            <span class="bn">
              বহুনির্বাচনি
            </span>

          </span>

        </button>


        <button
          class="mode-tab"
          data-mode="cq"
          aria-pressed="false"
        >

          <svg
            class="mode-icon"
            viewBox="0 0 20 20"
            width="16"
            height="16"
            fill="none"
            stroke="currentColor"
            stroke-width="1.6"
          >

            <path
              d="M4 15.5 3.5 17l1.5-.5L14.5 6.9c.5-.5.5-1.3 0-1.8l-.6-.6c-.5-.5-1.3-.5-1.8 0Z"
            />

            <path
              d="M12 5.5l2 2"
            />

          </svg>


          <span class="mode-tab-text">

            CQ Practice

            <span class="bn">
              সৃজনশীল
            </span>

          </span>

        </button>


      </div>

    </div>

  </aside>


  <main class="page-wrap">

    <div class="notebook-page">

      <div
        class="page-fold"
        aria-hidden="true"
      ></div>

      <div id="main-panel"></div>

    </div>

  </main>

</div>


<script src="js/config.js"></script>
<!-- <script src="js/mockApi.js"></script> -->
<script src="js/api.js"></script>
<script src="js/app.js"></script>

</body>
</html>
